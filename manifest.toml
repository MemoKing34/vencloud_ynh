#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "vencloud"
name = "Vencloud"
description.en = "Self-hosted cloud settings sync backend for the Vencord Discord client mod"
description.fr = "Backend auto-hébergé de synchronisation des paramètres pour le client mod Discord Vencord"

version = "0.0.2~ynh1"

maintainers = ["MemoKing34"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://vencord.dev"
code = "https://github.com/Vencord/Vencloud"
fund = "https://github.com/sponsors/lewisakura"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "700M"
ram.build = "500M"
ram.runtime = "50M"

[install]
    [install.domain]
    # Vencloud must be served at the root of a domain: the Vencord client
    # always queries absolute paths like /v1/settings on the backend URL.
    type = "domain"

    [install.discord_client_id]
    ask.en = "Discord application client ID"
    ask.fr = "ID client de l'application Discord"
    help.en = "Create an application on https://discord.com/developers/applications and copy the client ID from the OAuth2 tab."
    help.fr = "Créez une application sur https://discord.com/developers/applications et copiez l'ID client depuis l'onglet OAuth2."
    type = "string"
    example = "1234567890123456789"

    [install.discord_client_secret]
    ask.en = "Discord application client secret"
    ask.fr = "Secret client de l'application Discord"
    help.en = "Found in the OAuth2 tab of your Discord application (press 'Reset Secret' to generate it)."
    help.fr = "Disponible dans l'onglet OAuth2 de votre application Discord (cliquez sur 'Reset Secret' pour le générer)."
    type = "string"

    [install.allowed_users]
    ask.en = "Discord user IDs allowed to use this instance (comma separated)"
    ask.fr = "ID des utilisateurs Discord autorisés à utiliser cette instance (séparés par des virgules)"
    help.en = "Leave empty to allow every Discord user."
    help.fr = "Laissez vide pour autoriser tous les utilisateurs Discord."
    type = "string"
    optional = true
    default = ""

[resources]
    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/Vencord/Vencloud/archive/refs/tags/v0.0.2.tar.gz"
    sha256 = "511dc79be03979db3302de182ddb53fe4a83d2476b2d9ddf5c517375bb49d798"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    # Holds the dedicated Redis instance's dump.rdb (all synced settings live here)

    [resources.permissions]
    # Vencord calls the API from inside Discord, without any YunoHost session:
    # the API must stay publicly reachable.
    main.url = "/"
    main.allowed = "visitors"
    main.show_tile = false
    main.protected = true
    main.auth_header = false

    [resources.ports]
    main.default = 8485
    redis.default = 6380

    [resources.apt]
    packages = "redis-server"

    [resources.go]
    version = "1.27"
